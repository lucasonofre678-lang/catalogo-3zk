name: Sincronizar estoque Olist

on:
  workflow_dispatch:
  schedule:
    # A cada 30 minutos, fora do começo da hora.
    - cron: "17,47 * * * *"
  push:
    branches:
      - main
    # Alterações feitas pelo painel já atualizam produtos.json.
    # A Olist só precisa rodar por agenda, manualmente ou quando a automação/mapeamento mudar.
    paths:
      - "automacao/**"
      - ".github/workflows/atualizar-estoque.yml"

permissions:
  contents: write

concurrency:
  group: catalogo-3zk-estoque
  cancel-in-progress: false

jobs:
  sincronizar:
    name: Consultar Olist e atualizar catálogo
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Conferir segredo da Olist
        env:
          OLIST_API_TOKEN: ${{ secrets.OLIST_API_TOKEN }}
        run: |
          if [ -z "$OLIST_API_TOKEN" ]; then
            echo "::error::O segredo OLIST_API_TOKEN não foi configurado."
            exit 1
          fi

      - name: Consultar Olist e gerar catálogo público
        env:
          OLIST_API_TOKEN: ${{ secrets.OLIST_API_TOKEN }}
          OLIST_DELAY_SECONDS: "3.2"
          OLIST_DEPOSITOS_INCLUIDOS: "Geral,Loja presencial"
        run: |
          python automacao/atualizar_estoque.py

      - name: Registrar mudança de disponibilidade
        shell: bash
        run: |
          if git diff --quiet -- dados/produtos.json; then
            echo "Nenhum status de estoque mudou."
            exit 0
          fi

          git config user.name "3ZK Estoque Automático"
          git config user.email "actions@users.noreply.github.com"

          git add dados/produtos.json
          git commit -m "Atualiza disponibilidade do catálogo [automático]"
          git push
