name: Sincronizar estoque Olist

on:
  workflow_dispatch:
    inputs:
      permitir_grande_mudanca:
        description: "Permitir uma queda grande de disponibilidade nesta execução"
        required: false
        type: boolean
        default: false
      ids_olist:
        description: "Opcional: IDs Olist separados por vírgula para consulta rápida"
        required: false
        type: string
        default: ""
  schedule:
    # Horários de Brasília (UTC-3): 08:00, 15:00 e 18:00.
    - cron: "0 11,18,21 * * *"

permissions:
  contents: write

concurrency:
  # Nunca permite duas consultas pesadas à Olist ao mesmo tempo.
  group: catalogo-3zk-estoque
  cancel-in-progress: false

jobs:
  sincronizar:
    name: Consultar estoque e salvar resultado
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validar catálogo antes de consultar a Olist
        run: python automacao/validar_catalogo.py

      - name: Conferir segredo da Olist
        env:
          OLIST_API_TOKEN: ${{ secrets.OLIST_API_TOKEN }}
        run: |
          if [ -z "$OLIST_API_TOKEN" ]; then
            echo "::error::O segredo OLIST_API_TOKEN não foi configurado."
            exit 1
          fi

      - name: Consultar Olist
        env:
          OLIST_API_TOKEN: ${{ secrets.OLIST_API_TOKEN }}
          OLIST_DELAY_SECONDS: "3.2"
          OLIST_DEPOSITOS_INCLUIDOS: "Geral,Loja presencial"
          # Mantém uma margem abaixo do bloqueio observado próximo de 200 acessos.
          OLIST_MAX_REQUESTS_PER_RUN: "190"
          OLIST_ONLY_IDS: ${{ github.event_name == 'workflow_dispatch' && inputs.ids_olist || '' }}
          ALLOW_LARGE_STOCK_CHANGE: ${{ inputs.permitir_grande_mudanca && 'true' || 'false' }}
        run: |
          python automacao/atualizar_estoque.py

      - name: Validar resultado consultado
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in (
              Path("dados/produtos.json"),
              Path("dados/ultima-atualizacao.json"),
          ):
              with path.open("r", encoding="utf-8") as file:
                  json.load(file)
          print("Estoque consultado e validado.")
          PY

      - name: Aplicar somente o estoque sobre a versão mais recente
        shell: bash
        run: |
          cp dados/produtos.json /tmp/produtos-3zk-estoque.json
          cp dados/ultima-atualizacao.json /tmp/ultima-atualizacao-3zk.json

          # Uma foto, preço ou cadastro pode ter sido enviado enquanto esta
          # consulta longa estava em andamento. Voltamos à versão mais recente
          # e reaplicamos SOMENTE os status de estoque, preservando a base nova.
          git fetch origin main
          git reset --hard origin/main

          python automacao/gerar_catalogo_sem_consultar_olist.py \
            --base dados/produtos-base.json \
            --estoque-atual /tmp/produtos-3zk-estoque.json \
            --output dados/produtos.json

          cp /tmp/ultima-atualizacao-3zk.json dados/ultima-atualizacao.json
          python automacao/validar_catalogo.py --strict-public

      - name: Registrar estoque atualizado
        shell: bash
        run: |
          if git diff --quiet -- dados/produtos.json dados/ultima-atualizacao.json; then
            echo "Nenhuma alteração para registrar."
            exit 0
          fi

          git config user.name "3ZK Estoque Automático"
          git config user.email "actions@users.noreply.github.com"
          git add dados/produtos.json
          git add -f dados/ultima-atualizacao.json
          git commit -m "Atualiza disponibilidade do catálogo [automático]"
          git push origin HEAD:main

          echo "O commit do estoque acionará a publicação rápida automaticamente."
