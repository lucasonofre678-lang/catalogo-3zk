name: Publicar catálogo rápido

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "*.css"
      - "script.js"
      - "assets/**"
      - "dados/produtos-base.json"
      - "dados/produtos.json"
      - "dados/controle-catalogo.json"
      - "dados/ultima-atualizacao.json"
      - "automacao/gerar_catalogo_sem_consultar_olist.py"
      - "automacao/validar_catalogo.py"
      - "CNAME"
      - ".github/workflows/publicar-site.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: catalogo-3zk-publicacao
  cancel-in-progress: true

jobs:
  montar:
    name: Validar e montar site sem consultar estoque
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v6

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validar arquivos antes da publicação
        run: python automacao/validar_catalogo.py

      - name: Montar arquivos públicos
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site/dados

          cp index.html script.js _site/
          cp ./*.css _site/
          cp -R assets _site/assets
          cp dados/controle-catalogo.json _site/dados/controle-catalogo.json

          python automacao/gerar_catalogo_sem_consultar_olist.py \
            --output _site/dados/produtos.json

          if [ -f dados/ultima-atualizacao.json ]; then
            cp dados/ultima-atualizacao.json _site/dados/ultima-atualizacao.json
          fi

          if [ -f CNAME ]; then
            cp CNAME _site/CNAME
          fi

          touch _site/.nojekyll

      - name: Validar catálogo montado
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in (
              Path("_site/dados/produtos.json"),
              Path("_site/dados/controle-catalogo.json"),
          ):
              with path.open("r", encoding="utf-8") as file:
                  json.load(file)
          print("Publicação rápida validada.")
          PY

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar site para publicação
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

  publicar:
    name: Publicar catálogo
    needs: montar
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
