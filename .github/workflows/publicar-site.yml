name: Publicar catálogo rápido

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "index.html"
      - "links.html"
      - "*.css"
      - "script.js"
      - "assets/**"
      - "dados/produtos-base.json"
      - "dados/produtos.json"
      - "dados/controle-catalogo.json"
      - "dados/ultima-atualizacao.json"
      - "automacao/gerar_catalogo_sem_consultar_olist.py"
      - "automacao/validar_catalogo.py"
      - ".github/workflows/publicar-site.yml"

permissions:
  contents: read

concurrency:
  group: catalogo-3zk-publicacao
  cancel-in-progress: true

jobs:
  publicar:
    name: Validar, montar e publicar na Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v6

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validar arquivos antes da publicação
        run: python automacao/validar_catalogo.py

      - name: Montar arquivos públicos
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site/dados

          cp index.html links.html script.js _site/
          cp ./*.css _site/
          cp -R assets _site/assets
          cp dados/controle-catalogo.json _site/dados/controle-catalogo.json

          python automacao/gerar_catalogo_sem_consultar_olist.py \
            --output _site/dados/produtos.json

          if [ -f dados/ultima-atualizacao.json ]; then
            cp dados/ultima-atualizacao.json _site/dados/ultima-atualizacao.json
          fi

      - name: Validar catálogo montado
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in (
              Path("_site/dados/produtos.json"),
              Path("_site/dados/controle-catalogo.json"),
          ):
              with path.open("r", encoding="utf-8") as file:
                  json.load(file)

          print("Publicação rápida validada.")
          PY

      - name: Publicar na Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=catalogo-3zk --branch=main
