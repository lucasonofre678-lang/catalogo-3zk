<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#06247A">
    <meta name="description" content="3ZK — Tecnologia, qualidade e impressão 3D">

    <title>3ZK | Links</title>

    <link rel="stylesheet" href="links.css">
</head>

<body>

    <main class="links-page">

        <!-- DECORAÇÕES DE FUNDO -->
        <div class="background-decoration decoration-top"></div>
        <div class="background-decoration decoration-bottom"></div>


        <section class="links-container">

            <!-- LOGO -->
            <header class="brand">

                <img
                    src="assets/logo-fundo-invisivel.png"
                    alt="3ZK"
                    class="brand-logo"
                >

                <div class="brand-tagline">
                    <span>TECNOLOGIA</span>
                    <i></i>
                    <span>QUALIDADE</span>
                    <i></i>
                    <span>IMPRESSÃO 3D</span>
                </div>

            </header>


            <!-- TÍTULO -->
            <section class="welcome">

                <h1>Bem-vindo à 3ZK</h1>

                <p>
                    Escolha para onde você quer ir:
                </p>

            </section>


            <!-- LINKS -->
            <nav class="links-list" aria-label="Links da 3ZK">


                <!-- SITE FILAMENTOS -->
                <a
                    href="https://3zkfilamentos.com.br/"
                    class="link-card link-primary"
                    target="_blank"
                    rel="noopener noreferrer"
                >

                    <div class="link-icon">
                        <!-- Ícone globo -->
                        <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <circle cx="12" cy="12" r="9"></circle>
                            <path d="M3 12h18"></path>
                            <path d="M12 3c3 2.5 3 15.5 0 18"></path>
                            <path d="M12 3c-3 2.5-3 15.5 0 18"></path>
                        </svg>
                    </div>

                    <div class="link-content">

                        <span class="link-label">
                            SITE
                        </span>

                        <strong>
                            3ZK Filamentos
                        </strong>

                        <span class="link-description">
                            Filamentos para impressão 3D
                        </span>

                    </div>

                    <span class="link-arrow">
                        →
                    </span>

                </a>


                <!-- CATÁLOGO -->
                <a
                    href="https://3zk.com.br/"
                    class="link-card link-secondary"
                    target="_blank"
                    rel="noopener noreferrer"
                >

                    <div class="link-icon">

                        <!-- Ícone caixa -->
                        <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <path d="M12 3L21 8L12 13L3 8L12 3Z"></path>
                            <path d="M3 8V16L12 21L21 16V8"></path>
                            <path d="M12 13V21"></path>
                        </svg>

                    </div>

                    <div class="link-content">

                        <span class="link-label">
                            CATÁLOGO
                        </span>

                        <strong>
                            Catálogo 3ZK
                        </strong>

                        <span class="link-description">
                            Confira todos os nossos produtos
                        </span>

                    </div>

                    <span class="link-arrow">
                        →
                    </span>

                </a>

            </nav>


            <!-- RODAPÉ -->
            <footer class="footer">

                <span>3ZK</span>

                <i></i>

                <span>MAIS DO QUE FILAMENTOS</span>

            </footer>

        </section>

    </main>

</body>
</html>
